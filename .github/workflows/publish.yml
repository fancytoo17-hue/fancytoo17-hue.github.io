name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtain and verify approved public files
        run: |
          python3 - <<'PY'
          import json, hashlib, urllib.request, concurrent.futures
          from pathlib import Path
          from urllib.parse import quote
          manifest=json.loads(Path('.github/release-manifest.json').read_text())
          root=Path('public')
          origin='https://fengsiliang-portfolio.fancytoo17.workers.dev/'
          def obtain(item):
              p=root/item['path']
              if p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']:
                  return item['path']
              req=urllib.request.Request(origin+quote(item['path']),headers={'User-Agent':'Portfolio-release-verification','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  data=response.read()
              if hashlib.sha256(data).hexdigest()!=item['sha256']:
                  raise RuntimeError('SHA256 mismatch: '+item['path'])
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(data)
              return item['path']
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as executor:
              for path in executor.map(obtain,manifest):
                  print('Verified:',path)
          assert (root/'index.html').exists()
          print('All',len(manifest),'public files match the approved release.')
          PY
      - name: Preserve verified site in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Import verified portfolio public release"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
