name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved public release
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('public')
          manifest=json.loads(Path('.github/release-manifest.json').read_text())
          for item in manifest:
              p=root/item['path']
              assert p.is_file(),item['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256'],item['path']
          assert {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}=={i['path'] for i in manifest}
          print('Verified',len(manifest),'public files for approved baseline 4954e42')
          PY
          for script in public/*.js; do node --check "$script"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify live critical assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,time,urllib.request,concurrent.futures
          from urllib.parse import quote
          manifest=json.load(open('.github/release-manifest.json'))
          selected=[i for i in manifest if i['path'].endswith(('.html','.js','.css','.pdf','.mp4')) or i['path'].startswith('assets/cat-mobile/')]
          def check(item):
              for attempt in range(5):
                  try:
                      url=os.environ['SITE_URL'].rstrip('/')+'/'+quote(item['path'])+'?release='+os.environ['GITHUB_SHA']
                      with urllib.request.urlopen(url,timeout=25) as r: data=r.read()
                      if hashlib.sha256(data).hexdigest()!=item['sha256']: raise RuntimeError('Hash mismatch')
                      return item['path']
                  except Exception:
                      if attempt==4: raise
                      time.sleep(5)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for p in pool.map(check,selected): print('Live verified:',p)
          print('Live verification passed:',len(selected),'assets')
          PY
